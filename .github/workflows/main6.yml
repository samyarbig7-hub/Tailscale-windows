name: QEMU SPICE Remote Console

on:
  workflow_dispatch:
    
jobs:
  qemu-spice:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Install QEMU and Check Acceleration
        shell: pwsh
        run: |
          choco install qemu -y --no-progress

          $qemu = "C:\Program Files\qemu\qemu-system-x86_64.exe"

          if (-not (Test-Path $qemu)) {
            throw "QEMU executable not found."
          }

          "QEMU_EXE=$qemu" | Out-File $env:GITHUB_ENV -Append

          Write-Host "=== QEMU Version ==="
          & $qemu --version

          Write-Host "=== Available Accelerators ==="
          & $qemu -accel help

          Write-Host "=== CPU Information ==="
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

          Write-Host "=== Memory Information ==="
          Get-CimInstance Win32_ComputerSystem |
            Select-Object @{Name="RAM_GB";Expression={
              [math]::Round($_.TotalPhysicalMemory / 1GB, 2)
            }}

          Write-Host "=== Windows Hypervisor Platform ==="
          dism.exe /Online /Get-FeatureInfo /FeatureName:HypervisorPlatform

      - name: Check SPICE Support
        shell: pwsh
        run: |
          Write-Host "Checking QEMU SPICE support..."

          $output = & $env:QEMU_EXE -spice help 2>&1 |
            Out-String

          Write-Host $output

          if ($output -match "spice options:") {
            Write-Host "QEMU recognizes the SPICE options."
          } else {
            Write-Warning "Could not confirm SPICE support."
          }

          # این دستور صرفاً بررسی است؛ کد خروج 1 آن
          # به‌تنهایی به معنی نبود پشتیبانی SPICE نیست.
          exit 0

      - name: Install Tailscale
        shell: pwsh
        run: |
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

          Remove-Item $installer -Force

      - name: Establish Tailscale Connection
        run: |
          # Bring up Tailscale with the provided auth key and set a unique hostname
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          # Wait for Tailscale to assign an IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

            - name: Download Windows ISO
        shell: pwsh
        env:
          ISO_URL: "https://archive.org/download/Win10_IntegralEdition_2026.4.15/Windows%2010%2022H2.7184%2016in1%20en-US%20x64%20-%20Integral%20Edition%202026.4.15%20-%20CRC32%3Dabbf3579.iso"
        run: |
          $iso = "$env:RUNNER_TEMP\windows.iso"

          curl.exe -fSL --retry 3 "$env:ISO_URL" -o "$iso"

          if ($LASTEXITCODE -ne 0) {
            throw "ISO download failed."
          }

          if (!(Test-Path $iso)) {
            throw "ISO file was not downloaded."
          }

          "WINDOWS_ISO=$iso" |
            Out-File $env:GITHUB_ENV -Append
        
      - name: Start QEMU with SPICE
        shell: pwsh
        run: |
          $qemu = $env:QEMU_EXE
          $iso = "$env:RUNNER_TEMP\windows.iso"
          $disk = "$env:RUNNER_TEMP\windows10.qcow2"

          if (!(Test-Path $iso)) {
            throw "Windows ISO not found: $iso"
          }

          & $qemu `
            -machine q35 `
            -accel tcg,thread=multi `
            -cpu max `
            -smp 4 `
            -m 4G `
            -drive "file=$disk,format=qcow2,if=ide" `
            -cdrom "$iso" `
            -boot order=d `
            -display none `
            -spice "addr=127.0.0.1,port=5930,disable-ticketing=on"

      - name: Report Next Setup Requirements
        shell: pwsh
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "QEMU: $env:QEMU_EXE"
          Write-Host "RDP is not enabled by this workflow."
          Write-Host "Next: configure a Windows 10 ISO, VM disk,"
          Write-Host "and a SPICE-enabled QEMU build."
          
      - name:
        run: |
         # Keep runner active indefinitely (or until manually cancelled)
          while ($true) {
              Write-Host "[$(Get-Date)] QEMU Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
