name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Check HypervisorPlatform and Restart
        shell: pwsh
        run: |
          Write-Host "=== HypervisorPlatform Status ==="

          dism.exe /Online /Get-FeatureInfo /FeatureName:HypervisorPlatform

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to query HypervisorPlatform."
          }

          Write-Host "Restarting Windows..."

          shutdown.exe /r /t 0 /f

      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0 -Force

          # Keep Network Level Authentication enabled.
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 1 -Force

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          Restart-Service -Name TermService -Force

      - name: Create RDP User
        shell: pwsh
        run: |
          $charSet = @{
            Upper   = [char[]](65..90)
            Lower   = [char[]](97..122)
            Number  = [char[]](48..57)
            Special = ([char[]](33..47) + [char[]](58..64) +
                       [char[]](91..96) + [char[]](123..126))
          }

          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name 'RDP' -Password $securePass
          } else {
            New-LocalUser -Name 'RDP' -Password $securePass `
              -AccountNeverExpires | Out-Null
          }

          Add-LocalGroupMember -Group 'Administrators' -Member 'RDP' `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'RDP' `
            -ErrorAction SilentlyContinue

          "RDP_PASSWORD=$password" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "RDP account configured."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i `"$installerPath`" /quiet /norestart" `
            -Wait -PassThru

          Remove-Item $installerPath -Force

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed: $($process.ExitCode)"
          }

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Missing TAILSCALE_AUTH_KEY repository secret."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up "--auth-key=$env:TS_AUTHKEY" `
            "--hostname=gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          # Enable unattended operation.
          & $ts set --unattended=true

          if ($LASTEXITCODE -ne 0) {
            throw "Could not enable Tailscale unattended mode."
          }

          $tsIP = $null

          for ($i = 0; $i -lt 20 -and -not $tsIP; $i++) {
            Start-Sleep -Seconds 3
            $result = & $ts ip -4 2>$null
            if ($LASTEXITCODE -eq 0 -and $result) {
              $tsIP = ($result | Select-Object -First 1).Trim()
            }
          }

          if (-not $tsIP) {
            throw "Tailscale IP was not assigned."
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "Tailscale IP: $tsIP"
          Write-Host "Unattended mode enabled."

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Testing RDP connectivity..."

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $testResult.TcpTestSucceeded) {
            Write-Warning "RDP TCP connectivity test failed."
            Write-Warning "Check the Windows firewall and RDP service."
          } else {
            Write-Host "RDP TCP connectivity successful."
          }

      - name: Maintain Connection
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ env.RDP_PASSWORD }}
        run: |
          Write-Host ""
          Write-Host "=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password is available in the protected runner environment."
          Write-Host "=================="
          Write-Host ""

          while ($true) {
            Write-Host "[$(Get-Date)] RDP session is running."
            Start-Sleep -Seconds 300
          }
